[package]
name = "neural-os-ai"
version = "0.9.0"
edition = "2021"
description = "Self-learning bare-metal RISC-V kernel with a neural adaptive scheduler"
# The bare-metal kernel is built via ./build.sh (rustc on src/main.rs). Cargo is
# used only for host-side unit testing of the pure logic modules, exposed as a
# library, so disable auto target discovery of the kernel/bin/example sources.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "neural_os"
path = "src/lib.rs"

[profile.release]
panic = "abort"
opt-level = "z"
