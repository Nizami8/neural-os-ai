[target.riscv64gc-unknown-linux-gnu]
linker = "riscv64-unknown-linux-gnu-gcc"
rustflags = [
    "-C", "target-feature=+d,+f,+m",
    "-C", "link-arg=-Wl,-O2",
    "-C", "opt-level=z",
]

# No default `[build] target` on purpose: it would force `cargo test`/`clippy`
# to cross-compile for RISC-V (unrunnable on the host). Cross builds pass
# `--target riscv64gc-unknown-linux-gnu` explicitly (see build-milkv.sh).
